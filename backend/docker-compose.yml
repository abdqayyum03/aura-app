version: "3.9"

# Explicit project name - without this, Compose derives the project name from
# the current directory's basename ("backend"), which collides with any
# OTHER project whose own backend folder is also named "backend" (e.g. a
# sibling ATG808 project on the same machine). That collision is real, not
# hypothetical: it displaced ATG808's redis container the first time both
# projects' redis services were started back-to-back, because Compose
# thought they were the same logical service under the same project.
name: aura

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: aura-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura_dev_password
      POSTGRES_DB: aura
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d aura"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aura-redis
    restart: unless-stopped
    ports:
      # Host port 6380, not the default 6379 - keeps this from ever fighting
      # another local redis (Docker or a native one) for the same host port.
      # Matches REDIS_PORT in .env/.env.example; update both together.
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  emqx:
    image: emqx/emqx:5.7.1
    container_name: aura-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT
      - "8083:8083"   # MQTT over WebSocket
      - "18083:18083" # Dashboard UI (default admin/public)
    volumes:
      - emqx_data:/opt/emqx/data

volumes:
  timescale_data:
  redis_data:
  emqx_data:
